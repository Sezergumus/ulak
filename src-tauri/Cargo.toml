[package]
name = "ulak-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ulak-core = { path = "../crates/ulak-core" }
ulak-local = { path = "../crates/ulak-local" }
ulak-drag-probe = { path = "../crates/ulak-drag-probe" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

